name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCIPY_ARRAY_API: "1"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test (release; the reference quadrature is slow in debug)
        working-directory: rust
        run: cargo test --release
      - name: Clippy (all features)
        working-directory: rust
        run: cargo clippy --all-targets --features cli,parallel,python -- -D warnings -A clippy::manual_memcpy

  msrv:
    name: Rust MSRV (1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - name: Check the crate and its non-Python features on the declared rust-version
        working-directory: rust
        run: cargo check -p distmarg --features parallel,cli

  python-minimal:
    name: Python 3.10, core dependencies only (pure-Python fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python -e "python[test]"
      - name: Test
        run: .venv/bin/python -m pytest python/tests -q -rs

  python-full:
    name: Python 3.14, JAX + torch + Bilby + Rust backend, cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -e "python[test]" "jax[cpu]" bilby astropy maturin
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build the Rust extension (distmarg_rs)
        working-directory: rust/distmarg
        run: |
          source ../../.venv/bin/activate
          maturin develop --release --uv
      - name: Test
        run: .venv/bin/python -m pytest python/tests -q -rs
      - name: Python <-> Rust cross-check
        run: .venv/bin/python tools/cross_check.py --n 25
