[package]
name = "distmarg"
version = "0.1.0"
edition = "2021"
description = "Distance-marginalized gravitational-wave likelihood in the (rho_mf, v*) basis (independent Rust implementation)"
license = "MIT"

[lib]
# rlib for Rust users; cdylib so maturin can build the Python extension (feature "python")
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Python bindings (module `distmarg_rs`); built by maturin, never needed from Rust
python = ["dep:pyo3", "dep:numpy"]
# file-based evaluation CLI (distmarg-eval)
cli = ["dep:serde_json"]
# rayon-parallel batch evaluation
parallel = ["dep:rayon"]

[dependencies]
thiserror = "1"
libm = "0.2"
rayon = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
pyo3 = { version = "0.25", optional = true }
numpy = { version = "0.25", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "distmarg-eval"
path = "src/bin/distmarg_eval.rs"
required-features = ["cli"]

[[bench]]
name = "bench"
harness = false
