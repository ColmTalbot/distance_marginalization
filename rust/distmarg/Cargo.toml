[package]
name = "distmarg"
version = "0.1.0"
edition = "2021"
description = "Distance-marginalized gravitational-wave likelihood in the (rho_mf, v*) basis"
license = "MIT"
repository = "https://github.com/ColmTalbot/distance_marginalization"
readme = "README.md"
keywords = ["gravitational-waves", "likelihood", "marginalization", "bayesian", "astrophysics"]
categories = ["science", "mathematics"]
rust-version = "1.80"
# integration tests and benchmarks read ../../fixtures, which is not part of the crate
exclude = ["tests/", "benches/"]

[lib]
# rlib for Rust users; cdylib so maturin can build the Python extension (feature "python")
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Python bindings (module `distmarg_rs`); built by maturin, never needed from Rust
python = ["dep:pyo3", "dep:numpy"]
# complete configuration of the stable-ABI wheel for CPython >= 3.10 (one wheel per
# platform covers all versions). Self-contained because `maturin --features abi3`
# replaces, rather than extends, the features listed in pyproject.toml.
abi3 = ["python", "parallel", "pyo3/extension-module", "pyo3/abi3-py310", "pyo3/generate-import-lib"]
# file-based evaluation CLI (distmarg-eval)
cli = ["dep:serde_json"]
# rayon-parallel batch evaluation
parallel = ["dep:rayon"]

[dependencies]
thiserror = "1"
libm = "0.2"
rayon = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
pyo3 = { version = "0.25", optional = true }
numpy = { version = "0.25", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "distmarg-eval"
path = "src/bin/distmarg_eval.rs"
required-features = ["cli"]

[[bench]]
name = "bench"
harness = false
