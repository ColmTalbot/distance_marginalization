[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "distmarg-rs"
dynamic = ["version"]  # from Cargo.toml
description = "Rust backend for distmarg: distance-marginalized gravitational-wave likelihood"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/ColmTalbot/distance_marginalization"

[tool.maturin]
module-name = "distmarg_rs"
features = ["python", "parallel", "pyo3/extension-module"]
