[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "distmarg"
version = "0.1.0"
description = "Distance-marginalized gravitational-wave likelihood in the (rho_mf, v*) basis, array-API compatible"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.15", "array-api-compat>=1.4"]

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
jax = ["jax>=0.4"]
bilby = ["bilby", "astropy"]
test = ["pytest", "scipy", "mpmath"]

[tool.setuptools]
packages = ["distmarg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
